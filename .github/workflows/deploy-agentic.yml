name: Deploy Agentic Infra to Azure Container Apps

on:
  push:
    branches: [outmate]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker/build_and_push.Dockerfile'
      - '.github/workflows/deploy-agentic.yml'

env:
  REGISTRY: outmateregistry.azurecr.io
  IMAGE: outmate-agentic
  RESOURCE_GROUP: outmate-prod
  CONTAINER_APP: outmate-agentic

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/build_and_push.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Health check
        # outmate-agentic ingress is internal-only, so we cannot curl an external
        # URL.  Instead, ask Azure directly whether the latest revision became
        # Healthy + Running.  Polls for up to 5 minutes.
        run: |
          sleep 20
          for i in {1..30}; do
            STATE=$(az containerapp revision show \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "${{ env.CONTAINER_APP }}" \
              --revision "$(az containerapp show -n ${{ env.CONTAINER_APP }} -g ${{ env.RESOURCE_GROUP }} --query properties.latestRevisionName -o tsv)" \
              --query "{health:properties.healthState, running:properties.runningState}" -o tsv 2>/dev/null || echo "  ")
            HEALTH=$(echo "$STATE" | awk '{print $1}')
            RUNNING=$(echo "$STATE" | awk '{print $2}')
            echo "Revision health=$HEALTH running=$RUNNING (poll $i/30)"
            if [ "$HEALTH" = "Healthy" ] && [ "$RUNNING" = "Running" ]; then
              echo "✓ Latest revision is Healthy and Running"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed — revision did not become Healthy/Running within 5 min"
          exit 1
