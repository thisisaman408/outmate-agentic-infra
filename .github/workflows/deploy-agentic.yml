name: Deploy Agentic Infra to Azure Container Apps

on:
  push:
    branches: [outmate]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker/build_and_push.Dockerfile'
      - '.github/workflows/deploy-agentic.yml'

env:
  REGISTRY: outmateregistry.azurecr.io
  IMAGE: outmate-agentic
  RESOURCE_GROUP: outmate-prod
  CONTAINER_APP: outmate-agentic

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/build_and_push.Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Health check
        run: |
          sleep 20
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://outmate-agentic.greenbeach-bf0c913b.eastus.azurecontainerapps.io/health)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "App responding (HTTP $STATUS)"
              exit 0
            fi
            echo "Waiting... (HTTP $STATUS)"
            sleep 5
          done
          echo "Health check failed - app not responding"
          exit 1
