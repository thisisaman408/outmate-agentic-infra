name: Deploy Frontend to Azure Container Apps

on:
  push:
    branches: [outmate]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  REGISTRY: outmateregistry.azurecr.io
  IMAGE: outmate-frontend
  RESOURCE_GROUP: outmate-prod
  CONTAINER_APP: outmate-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Frontend
        run: npm install --force

      - name: Build (clean)
        working-directory: Frontend
        run: |
          rm -rf .next
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://dev.outmate.ai
          NEXT_PUBLIC_PIXEL_KEY: pk_8673a1dd795f70ba14f96478d7409ac2
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          REDIS_URL: redis://localhost:6379

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          cd Frontend
          docker build --no-cache --platform linux/amd64 -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Health check
        run: |
          sleep 15
          for i in {1..20}; do
            if curl -sSf https://app.outmate.ai > /dev/null; then
              echo "Health OK"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
