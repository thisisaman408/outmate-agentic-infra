name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [outmate]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  REGISTRY: outmateregistry.azurecr.io
  IMAGE: outmate-api
  RESOURCE_GROUP: outmate-prod
  CONTAINER_APP: outmate-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          cd Backend
          docker build --platform linux/amd64 -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Health check
        run: |
          sleep 10
          for i in {1..20}; do
            if curl -sSf https://dev.outmate.ai/health; then
              echo "Health OK"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
