[project]
name = "executive_churn_prediction_engine"
version = "0.1.0"
description = "executive_churn_prediction_engine using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.9.3",
]

[project.scripts]
executive_churn_prediction_engine = "executive_churn_prediction_engine.main:run"
run_crew = "executive_churn_prediction_engine.main:run"
train = "executive_churn_prediction_engine.main:train"
replay = "executive_churn_prediction_engine.main:replay"
test = "executive_churn_prediction_engine.main:test"
run_with_trigger = "executive_churn_prediction_engine.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
