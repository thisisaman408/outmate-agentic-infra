[project]
name = "global_outreach_compliance_engine"
version = "0.1.0"
description = "global_outreach_compliance_engine using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.9.3",
]

[project.scripts]
global_outreach_compliance_engine = "global_outreach_compliance_engine.main:run"
run_crew = "global_outreach_compliance_engine.main:run"
train = "global_outreach_compliance_engine.main:train"
replay = "global_outreach_compliance_engine.main:replay"
test = "global_outreach_compliance_engine.main:test"
run_with_trigger = "global_outreach_compliance_engine.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
