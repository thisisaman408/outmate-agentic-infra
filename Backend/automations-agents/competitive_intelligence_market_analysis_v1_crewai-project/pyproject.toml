[project]
name = "competitive_intelligence_market_analysis"
version = "0.1.0"
description = "competitive_intelligence_market_analysis using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.9.3",
]

[project.scripts]
competitive_intelligence_market_analysis = "competitive_intelligence_market_analysis.main:run"
run_crew = "competitive_intelligence_market_analysis.main:run"
train = "competitive_intelligence_market_analysis.main:train"
replay = "competitive_intelligence_market_analysis.main:replay"
test = "competitive_intelligence_market_analysis.main:test"
run_with_trigger = "competitive_intelligence_market_analysis.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
