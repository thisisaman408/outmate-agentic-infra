  <circle cx="160" cy="240" r="2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="240" cy="340" r="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Subtle grid -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
