<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a0d2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="55%">
      <stop offset="0%" style="stop-color:#e040fb;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#ab47bc;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0f0a1a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2b" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.2"/>
      <stop offset="60%" style="stop-color:#ea580c;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#0f0a1a;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg2)"/>
  <rect width="600" height="800" fill="url(#glow2)"/>
  <rect width="600" height="800" fill="url(#glow2b)"/>
  <!-- Bar chart visualization -->
  <g opacity="0.1" transform="translate(100,350)" filter="url(#blur2)">
    <rect x="0" y="200" width="40" height="100" rx="4" fill="#e040fb"/>
    <rect x="60" y="150" width="40" height="150" rx="4" fill="#e040fb"/>
    <rect x="120" y="80" width="40" height="220" rx="4" fill="#f97316"/>
    <rect x="180" y="120" width="40" height="180" rx="4" fill="#e040fb"/>
    <rect x="240" y="50" width="40" height="250" rx="4" fill="#f97316"/>
    <rect x="300" y="160" width="40" height="140" rx="4" fill="#e040fb"/>
    <rect x="360" y="30" width="40" height="270" rx="4" fill="#f97316"/>
  </g>
  <!-- Scoring trend line -->
  <g opacity="0.12">
    <path d="M100,520 L160,480 L220,400 L280,430 L340,350 L400,320 L460,280" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="520" r="3" fill="#f97316"/>
    <circle cx="220" cy="400" r="3" fill="#f97316"/>
    <circle cx="340" cy="350" r="4" fill="#f97316"/>
    <circle cx="460" cy="280" r="3" fill="#f97316"/>
  </g>
  <!-- Target/bullseye -->
  <g opacity="0.05" transform="translate(400,250)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#e040fb" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#e040fb" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f97316" stroke-width="1"/>
    <circle cx="0" cy="0" r="10" fill="#f97316" opacity="0.3"/>
  </g>
  <!-- Flowing arcs -->
  <g opacity="0.06">
    <path d="M0,600 Q200,550 400,620 T600,580" fill="none" stroke="#e040fb" stroke-width="1"/>
    <path d="M0,640 Q200,600 400,660 T600,620" fill="none" stroke="#e040fb" stroke-width="0.8"/>
  </g>
</svg>
